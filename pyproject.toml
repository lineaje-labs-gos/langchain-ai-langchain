[tool.poetry]
name = "langchain-monorepo"
version = "0.0.1"
description = "LangChain mono-repo"
authors = []
license = "MIT"
readme = "README.md"
repository = "https://www.github.com/langchain-ai/langchain"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"

[tool.poetry.group.lint.dependencies]
ruff = "^0.5.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.2"

[tool.poetry.group.dev.dependencies.langchain-core]
path = "libs/core/"
develop = true

[tool.poetry.group.dev.dependencies.langchain-text-splitters]
path = "libs/text-splitters"
develop = true

[tool.poetry.group.dev.dependencies.langchain-community]
path = "libs/community/"
develop = true

[tool.poetry.group.dev.dependencies.langchain]
path = "libs/langchain/"
develop = true

[tool.poetry.group.dev.dependencies.langchain-openai]
path = "libs/partners/openai"
develop = true

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.0"

[tool.poetry.group.typing.dependencies]

[tool.poetry.group.test.dependencies]
jupyter = "^1.1.1"
click = "^8.1.7"
faiss-cpu = "^1.7.4"
pypdf = "^5.0.0"
vcrpy = "^6.0.1"

[tool.poetry.group.test.dependencies.langchain-experimental]
git = "https://github.com/langchain-ai/langchain-experimental.git"
subdirectory = "libs/experimental"

[tool.poetry.group.test.dependencies.langchain-anthropic]
path = "libs/partners/anthropic"
develop = true

[tool.poetry.group.test.dependencies.langchain-chroma]
path = "libs/partners/chroma"
develop = true

[tool.poetry.group.test.dependencies.langchain-mistralai]
path = "libs/partners/mistralai"
develop = true

[tool.poetry.group.test.dependencies.langgraph]
git = "https://github.com/langchain-ai/langgraph.git"
subdirectory = "libs/langgraph"

[tool.codespell]
skip = ".git,*.pdf,*.svg,*.pdf,*.yaml,*.ipynb,poetry.lock,*.min.js,*.css,package-lock.json,example_data,_dist,examples,templates,*.trig"
ignore-regex = ".*(Stati Uniti|Tense=Pres).*"
ignore-words-list = "momento,collison,ned,foor,reworkd,parth,whats,aapply,mysogyny,unsecure,damon,crate,aadd,symbl,precesses,accademia,nin,cann"

[tool.ruff]
extend-include = [
    "*.ipynb",
]
extend-exclude = [
    "docs/docs/expression_language/why.ipynb",
]

[tool.ruff.lint.per-file-ignores]
"**/{cookbook,docs}/*" = [
    "E402",
    "F401",
    "F811",
    "F841",
]
"cookbook/gymnasium_agent_simulation.ipynb" = [
    "F821",
]
"docs/docs/integrations/document_loaders/tensorflow_datasets.ipynb" = [
    "F821",
]

[project]
version = "1.1.0+lineaje.1"
maintainers = [
    { name = "Lineaje DepFixer", email = "221268890+Lineaje-DepFixer@users.noreply.github.com" },
]

[project.urls]
Homepage = "https://github.com/lineaje-labs-gos/langchain-ai-langchain"
Repository = "https://github.com/lineaje-labs-gos/langchain-ai-langchain"
Tracker = "https://github.com/lineaje-labs-gos/langchain-ai-langchain/issues"
